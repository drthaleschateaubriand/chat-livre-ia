# Workflow de deploy no GitHub Pages (cópia de .github/workflows/deploy.yml).
# O token usado na criação deste repositório NÃO tinha o escopo `workflow`, por isso o arquivo ficou aqui em docs/.
# Como ativar (1 minuto): copie este arquivo para .github/workflows/deploy.yml pelo site do GitHub (botão "Add file")
# ou faça `git mv docs/deploy-workflow.yml .github/workflows/deploy.yml` com um token que tenha o escopo workflow,
# e em Settings > Pages troque "Source" para "GitHub Actions".
name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
